[package]
name = "canvie"
version = "0.0.1"
description = "Canvie local desktop canvas"
authors = ["JooCrepaldi"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "canvie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", default-features = false, features = ["wry"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
